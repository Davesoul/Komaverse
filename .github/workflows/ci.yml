name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install torch (CPU) first so ultralytics skips CUDA wheels
        run: pip install --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch
      - name: Install backend with test deps
        run: pip install --no-cache-dir "./backend[dev]"
      - name: Lint (ruff, risk-fix scope)
        run: ruff check src/komaverse/main.py src/komaverse/db.py src/komaverse/observability.py src/komaverse/security.py src/komaverse/api/scans.py src/komaverse/models.py src/komaverse/db_models.py tests/test_risk_fixes.py tests/test_error_handlers.py tests/test_security.py tests/test_observability.py tests/test_scans.py
        working-directory: backend
      - name: Typecheck (mypy, risk-fix scope)
        run: mypy --follow-imports=silent src/komaverse/main.py src/komaverse/db.py src/komaverse/observability.py src/komaverse/security.py src/komaverse/models.py src/komaverse/db_models.py
        working-directory: backend
      - name: Run backend tests
        run: PYTHONPATH=src python -m pytest tests -q -p no:cacheprovider
        working-directory: backend
      - name: Eval gates (detection F1 + export latency)
        run: PYTHONPATH=src python ../eval/detect_f1.py && PYTHONPATH=src python ../eval/export_latency.py
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/studio-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
