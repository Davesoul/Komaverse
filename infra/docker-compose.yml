services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: komaverse
      POSTGRES_USER: komaverse
      POSTGRES_PASSWORD: ${DB_PASSWORD:-komaverse}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U komaverse -d komaverse"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ../backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg://komaverse:${DB_PASSWORD:-komaverse}@postgres:5432/komaverse
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - ../backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redis-data:
