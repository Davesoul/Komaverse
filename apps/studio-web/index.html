<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0b0d" />
    <meta
      name="description"
      content="Komaverse is an AI anime studio: scan manga, detect panels, draw, animate on a timeline, generate with AI, and export video."
    />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Komaverse — AI Anime Studio" />
    <meta
      property="og:description"
      content="Turn manga into animation: scan, draw, animate, and generate with AI in one studio."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Komaverse — AI Anime Studio" />

      name="twitter:description"
      content="Turn manga into animation: scan, draw, animate, and generate with AI."
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/komaverse-logo.png" />

      parse so both are decoded before the overlay mounts (no startup hitch
      when the music starts). -->
    <link rel="preload" href="/ident.html" as="document" fetchpriority="high" />
    <link rel="preload" href="/audio/ident-sting.mp3" as="audio" fetchpriority="high" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Komaverse — AI Anime Studio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
