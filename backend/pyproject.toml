[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "komaverse"
version = "0.1.0"
description = "Komaverse AI Anime Studio — API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "sqlalchemy>=2",
  "pillow>=10",
  "opencv-python-headless>=4.9",
  "ultralytics>=8.3",
  "httpx>=0.27",
  "python-multipart>=0.0.18",
  # Pinned: the renderer shells this binary's CLI (libx264 + libass
  # subtitles filter). A major bump changes flags/output, so re-verify
  # renderer.ffmpeg_info() before widening the range.
  "imageio-ffmpeg>=0.5.1,<1",
  # System-voice fallback for vendored local TTS (SAPI on Windows).
  "pyttsx3>=2.90",
  # Per-user BYOK vault (Fernet encryption for stored provider keys).
  "cryptography>=42",
  # Koma Portal top-ups: Checkout Sessions + signed webhooks.
  "stripe>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.4", "mypy>=1.10"]
# Neural local voice (Kokoro): torch is already required; the voice
# weights (~300 MB) download from Hugging Face on first synthesis.
# onnxruntime is Kokoro's CPU inference engine (pykokoro leaves it optional).
voice = ["pykokoro>=0.9.0", "onnxruntime>=1.20"]

[tool.hatch.build.targets.wheel]
packages = ["src/komaverse"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008 (function call in default arg) is FastAPI's documented DI pattern
# (Depends()/File() defaults on every endpoint); flagging it repo-wide
# would outlaw the framework's own idiom.
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
exclude = ["tests/"]
