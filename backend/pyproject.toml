[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "komaverse"
version = "0.1.0"
description = "Komaverse AI Anime Studio — API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "sqlalchemy>=2",
  "pillow>=10",
  "opencv-python-headless>=4.9",
  "ultralytics>=8.3",
  "python-multipart>=0.0.18",
  "imageio-ffmpeg>=0.5",
  # System-voice fallback for vendored local TTS (SAPI on Windows).
  "pyttsx3>=2.90",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
# Neural local voice (Kokoro): torch is already required; the voice
# weights (~300 MB) download from Hugging Face on first synthesis.
# onnxruntime is Kokoro's CPU inference engine (pykokoro leaves it optional).
voice = ["pykokoro>=0.9.0", "onnxruntime>=1.20"]

[tool.hatch.build.targets.wheel]
packages = ["src/komaverse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
