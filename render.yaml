# Render Blueprint: Komaverse all-in-one (API + built UI on one port).
# One-click: connect the repo in Render → New → Blueprint → select this file.
# Keys ship empty on purpose: paste them in the studio Brain panel after
# first login (demo@komaverse.local / demo1234 seeds only with KOMA_SEED_DEMO).
# Free tier: no disk (uploads vanish on restart — fine for a demo, not
# for keeps). Paid upgrade path: plan starter + a 5GB disk at /data.
services:
  - type: web
    name: komaverse
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: KOMA_SEED_DEMO
        value: "true"
      - key: PORT
        value: "8000"
      # Bring-your-own-key vault: WITHOUT this, users cannot save their
      # own provider keys (Brain panel answers 503). sync:false means
      # Render asks for the value on first deploy and never overwrites
      # it — paste the Fernet key handed over with this deploy, do NOT
      # commit it to the repo. Generate a fresh one with:
      #   python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      - key: KEY_VAULT_SECRET
        sync: false
