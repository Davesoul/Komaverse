# Render Blueprint: Komaverse all-in-one (API + built UI on one port).
# One-click: connect the repo in Render → New → Blueprint → select this file.
# Keys ship empty on purpose: paste them in the studio Brain panel after
# first login (demo@komaverse.local / demo1234 seeds only with SEED_DEMO).
# NOTE: the disk below needs a paid instance type (Starter+); on the free
# tier remove the disk and accept ephemeral storage (uploads vanish on
# restart — fine for a demo, not for keeps).
services:
  - type: web
    name: komaverse
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /health
    disk:
      name: komaverse-data
      mountPath: /data
      sizeGB: 5
    envVars:
      - key: SEED_DEMO
        value: "true"
      - key: PORT
        value: "8000"
